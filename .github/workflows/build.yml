# Тихий ПК — автоматичне збирання на GitHub.
# • Новий тег (наприклад v3.2) → GitHub збирає Tykhyi-PK-setup.exe і кладе його в ЧЕРНЕТКУ релізу.
#   Перевір файл і натисни «Publish release» — тоді його отримає сайт.
# • Вкладка Actions → «Збирання» → «Run workflow» — пробне збирання без релізу (файл у «Artifacts»).
name: Збирання

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Зібрати програму
        shell: powershell
        run: ./src/build.ps1

      - name: Зберегти файл
        uses: actions/upload-artifact@v4
        with:
          name: Tykhyi-PK-setup
          path: src/Tykhyi-PK-setup.exe

      - name: Додати в чернетку релізу
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Тихий ПК ${TAG#v}" \
              --notes "Тихий ПК ${TAG#v} для Windows 10 і 11. Завантаж Tykhyi-PK-setup.exe і запусти його."
          fi
          gh release upload "$TAG" src/Tykhyi-PK-setup.exe --clobber
