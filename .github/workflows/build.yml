# Тихий ПК — автоматичне збирання на GitHub.
# Вкладка Actions → «Збирання» → «Run workflow»:
# • поле «Версія» порожнє — пробне збирання, файл з'явиться внизу сторінки запуску в «Artifacts»;
# • у полі «Версія» число (наприклад 3.2) — GitHub збере Tykhyi-PK-setup.exe і створить ЧЕРНЕТКУ релізу v3.2
#   з описом із CHANGES.md (розділ «## 3.2»). Перевір файл і натисни «Publish release» — тоді його почне
#   видавати сайт, програми самі запропонують оновитися, а в Telegram-канал піде допис (telegram.yml).
name: Збирання

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія для релізу (наприклад 3.2). Порожньо — лише пробне збирання.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Зібрати програму
        shell: powershell
        run: ./src/build.ps1

      - name: Зберегти файл
        uses: actions/upload-artifact@v4
        with:
          name: Tykhyi-PK-setup
          path: src/Tykhyi-PK-setup.exe

      - name: Створити чернетку релізу
        if: inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
        run: |
          VER="${VER#v}"
          TAG="v$VER"
          # Номер у програмі (src/Version.cs) має збігатися з номером релізу.
          grep -q "Text = \"$VER\"" src/Version.cs || { echo "::error::У src/Version.cs інша версія — зміни Text на \"$VER\"."; exit 1; }
          # Опис релізу — розділ «## $VER» з CHANGES.md (він же піде в Telegram-канал).
          NOTES=$(awk -v v="## $VER" '{sub(/\r$/,"")} $0==v{f=1;next} /^## /{if(f)exit} f' CHANGES.md | sed '/./,$!d')
          [ -z "$NOTES" ] && NOTES="Тихий ПК $VER для Windows 10 і 11."
          printf '%s\n\nЗавантаж Tykhyi-PK-setup.exe нижче й запусти його — він сам оновить програму, налаштування збережуться.\n' "$NOTES" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Чернетку (ще не опубліковану) переносимо на свіжий код і оновлюємо опис; опублікований реліз не чіпаємо.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file notes.md
            fi
            gh release upload "$TAG" src/Tykhyi-PK-setup.exe --clobber
          else
            gh release create "$TAG" src/Tykhyi-PK-setup.exe --draft --target "$GITHUB_SHA" --title "Тихий ПК $VER" --notes-file notes.md
          fi
